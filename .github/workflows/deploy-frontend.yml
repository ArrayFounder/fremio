name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'my-app/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: my-app/package-lock.json
          
      - name: Install dependencies
        working-directory: ./my-app
        run: npm ci

      - name: Set build env
        run: |
          echo "VITE_API_URL=${VITE_API_URL:-https://api.fremio.id/api}" >> $GITHUB_ENV
          echo "VITE_BACKEND_MODE=${VITE_BACKEND_MODE:-VPS}" >> $GITHUB_ENV
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_BACKEND_MODE: ${{ secrets.VITE_BACKEND_MODE }}
        
      - name: Build frontend
        working-directory: ./my-app
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./my-app/dist --project-name=fremio --branch=main

      - name: Notify success
        if: success()
        run: echo "✅ Deployed to Cloudflare Pages!"
