<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Signing in with Google...</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f9fafb; }
    .card { background: white; padding: 32px; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); text-align: center; }
    .spinner { width: 40px; height: 40px; border: 3px solid #e5e7eb; border-top-color: #c89585; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { color: #374151; font-size: 1.1rem; margin: 0 0 8px; }
    p { color: #6b7280; font-size: 0.9rem; margin: 0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Masuk dengan Google...</h2>
    <p>Harap tunggu sebentar</p>
  </div>

  <script>
    (async function() {
      try {
        // Get credential from URL search params (redirect flow)
        const params = new URLSearchParams(window.location.search);
        const credential = params.get('credential');

        if (!credential) {
          window.location.href = '/login?error=no_credential';
          return;
        }

        // Send credential to backend
        const res = await fetch('/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ credential })
        });

        const data = await res.json();

        if (data.success && data.token) {
          // Store auth data
          localStorage.setItem('fremio_token', data.token);
          localStorage.setItem('fremio_user', JSON.stringify(data.user));
          // Redirect to frames/dashboard
          window.location.href = '/frames';
        } else {
          window.location.href = '/login?error=' + encodeURIComponent(data.error || 'google_auth_failed');
        }
      } catch(e) {
        console.error('Google callback error:', e);
        window.location.href = '/login?error=callback_error';
      }
    })();
  </script>
</body>
</html>
